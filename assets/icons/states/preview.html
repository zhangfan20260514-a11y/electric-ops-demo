<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>状态图标预览 32×32</title>
<style>
  :root { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { margin:0; padding:32px 40px 64px; background:#f4f6f9; color:#1f2d3d; }
  h1 { font-size:20px; margin:0 0 6px; }
  p.lead { margin:0 0 28px; color:#5b6b7d; font-size:13px; }
  .swatches { display:flex; gap:18px; margin:0 0 28px; }
  .swatches span { display:flex; align-items:center; gap:8px; font-size:12px; color:#4a5b6d; }
  .swatches i { width:16px; height:16px; border-radius:50%; display:inline-block; }
  section { background:#fff; border-radius:10px; padding:16px 20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(20,40,70,.07); }
  h3 { font-size:13px; margin:0 0 12px; color:#33455c; display:flex; align-items:center; gap:8px; }
  h3 code { font-size:11px; color:#8b9aab; font-weight:400; }
  .row { display:flex; gap:22px; }
  figure { margin:0; text-align:center; }
  img { width:32px; height:32px; display:block; margin:0 auto 6px; }
  figcaption { font-size:11px; color:#8b9aab; }
</style>
</head>
<body>
<h1>状态图标集 · 32×32</h1>
<p class="lead">圆形背景 + 白色描边图形，共 15 个图形 × 5 种状态 = 75 个 SVG。文件位于 assets/icons/states/，命名规则 图形-状态.svg。</p>
<div class="swatches">
  <span><i style="background:#E89D88"></i>红 #E89D88</span>
  <span><i style="background:#98D582"></i>绿 #98D582</span>
  <span><i style="background:#D0CCCC"></i>灰 #D0CCCC</span>
  <span><i style="background:#EFA560"></i>橙 #EFA560</span>
  <span><i style="background:#49A5FF"></i>蓝 #49A5FF</span>
</div>
<section><h3>对话<code>chat</code></h3><div class="row"><figure><img src="chat-red.svg" alt="对话"><figcaption>红</figcaption></figure><figure><img src="chat-green.svg" alt="对话"><figcaption>绿</figcaption></figure><figure><img src="chat-gray.svg" alt="对话"><figcaption>灰</figcaption></figure><figure><img src="chat-orange.svg" alt="对话"><figcaption>橙</figcaption></figure><figure><img src="chat-blue.svg" alt="对话"><figcaption>蓝</figcaption></figure></div></section><section><h3>人员卡片<code>user-card</code></h3><div class="row"><figure><img src="user-card-red.svg" alt="人员卡片"><figcaption>红</figcaption></figure><figure><img src="user-card-green.svg" alt="人员卡片"><figcaption>绿</figcaption></figure><figure><img src="user-card-gray.svg" alt="人员卡片"><figcaption>灰</figcaption></figure><figure><img src="user-card-orange.svg" alt="人员卡片"><figcaption>橙</figcaption></figure><figure><img src="user-card-blue.svg" alt="人员卡片"><figcaption>蓝</figcaption></figure></div></section><section><h3>电话<code>phone</code></h3><div class="row"><figure><img src="phone-red.svg" alt="电话"><figcaption>红</figcaption></figure><figure><img src="phone-green.svg" alt="电话"><figcaption>绿</figcaption></figure><figure><img src="phone-gray.svg" alt="电话"><figcaption>灰</figcaption></figure><figure><img src="phone-orange.svg" alt="电话"><figcaption>橙</figcaption></figure><figure><img src="phone-blue.svg" alt="电话"><figcaption>蓝</figcaption></figure></div></section><section><h3>多人<code>users</code></h3><div class="row"><figure><img src="users-red.svg" alt="多人"><figcaption>红</figcaption></figure><figure><img src="users-green.svg" alt="多人"><figcaption>绿</figcaption></figure><figure><img src="users-gray.svg" alt="多人"><figcaption>灰</figcaption></figure><figure><img src="users-orange.svg" alt="多人"><figcaption>橙</figcaption></figure><figure><img src="users-blue.svg" alt="多人"><figcaption>蓝</figcaption></figure></div></section><section><h3>文字<code>text</code></h3><div class="row"><figure><img src="text-red.svg" alt="文字"><figcaption>红</figcaption></figure><figure><img src="text-green.svg" alt="文字"><figcaption>绿</figcaption></figure><figure><img src="text-gray.svg" alt="文字"><figcaption>灰</figcaption></figure><figure><img src="text-orange.svg" alt="文字"><figcaption>橙</figcaption></figure><figure><img src="text-blue.svg" alt="文字"><figcaption>蓝</figcaption></figure></div></section><section><h3>设置<code>gear</code></h3><div class="row"><figure><img src="gear-red.svg" alt="设置"><figcaption>红</figcaption></figure><figure><img src="gear-green.svg" alt="设置"><figcaption>绿</figcaption></figure><figure><img src="gear-gray.svg" alt="设置"><figcaption>灰</figcaption></figure><figure><img src="gear-orange.svg" alt="设置"><figcaption>橙</figcaption></figure><figure><img src="gear-blue.svg" alt="设置"><figcaption>蓝</figcaption></figure></div></section><section><h3>旗标<code>flag</code></h3><div class="row"><figure><img src="flag-red.svg" alt="旗标"><figcaption>红</figcaption></figure><figure><img src="flag-green.svg" alt="旗标"><figcaption>绿</figcaption></figure><figure><img src="flag-gray.svg" alt="旗标"><figcaption>灰</figcaption></figure><figure><img src="flag-orange.svg" alt="旗标"><figcaption>橙</figcaption></figure><figure><img src="flag-blue.svg" alt="旗标"><figcaption>蓝</figcaption></figure></div></section><section><h3>目标<code>target</code></h3><div class="row"><figure><img src="target-red.svg" alt="目标"><figcaption>红</figcaption></figure><figure><img src="target-green.svg" alt="目标"><figcaption>绿</figcaption></figure><figure><img src="target-gray.svg" alt="目标"><figcaption>灰</figcaption></figure><figure><img src="target-orange.svg" alt="目标"><figcaption>橙</figcaption></figure><figure><img src="target-blue.svg" alt="目标"><figcaption>蓝</figcaption></figure></div></section><section><h3>群组<code>group</code></h3><div class="row"><figure><img src="group-red.svg" alt="群组"><figcaption>红</figcaption></figure><figure><img src="group-green.svg" alt="群组"><figcaption>绿</figcaption></figure><figure><img src="group-gray.svg" alt="群组"><figcaption>灰</figcaption></figure><figure><img src="group-orange.svg" alt="群组"><figcaption>橙</figcaption></figure><figure><img src="group-blue.svg" alt="群组"><figcaption>蓝</figcaption></figure></div></section><section><h3>调节<code>sliders</code></h3><div class="row"><figure><img src="sliders-red.svg" alt="调节"><figcaption>红</figcaption></figure><figure><img src="sliders-green.svg" alt="调节"><figcaption>绿</figcaption></figure><figure><img src="sliders-gray.svg" alt="调节"><figcaption>灰</figcaption></figure><figure><img src="sliders-orange.svg" alt="调节"><figcaption>橙</figcaption></figure><figure><img src="sliders-blue.svg" alt="调节"><figcaption>蓝</figcaption></figure></div></section><section><h3>摄像设备<code>camera</code></h3><div class="row"><figure><img src="camera-red.svg" alt="摄像设备"><figcaption>红</figcaption></figure><figure><img src="camera-green.svg" alt="摄像设备"><figcaption>绿</figcaption></figure><figure><img src="camera-gray.svg" alt="摄像设备"><figcaption>灰</figcaption></figure><figure><img src="camera-orange.svg" alt="摄像设备"><figcaption>橙</figcaption></figure><figure><img src="camera-blue.svg" alt="摄像设备"><figcaption>蓝</figcaption></figure></div></section><section><h3>看板<code>board</code></h3><div class="row"><figure><img src="board-red.svg" alt="看板"><figcaption>红</figcaption></figure><figure><img src="board-green.svg" alt="看板"><figcaption>绿</figcaption></figure><figure><img src="board-gray.svg" alt="看板"><figcaption>灰</figcaption></figure><figure><img src="board-orange.svg" alt="看板"><figcaption>橙</figcaption></figure><figure><img src="board-blue.svg" alt="看板"><figcaption>蓝</figcaption></figure></div></section><section><h3>清单<code>list</code></h3><div class="row"><figure><img src="list-red.svg" alt="清单"><figcaption>红</figcaption></figure><figure><img src="list-green.svg" alt="清单"><figcaption>绿</figcaption></figure><figure><img src="list-gray.svg" alt="清单"><figcaption>灰</figcaption></figure><figure><img src="list-orange.svg" alt="清单"><figcaption>橙</figcaption></figure><figure><img src="list-blue.svg" </body>
</html>
