<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 270" role="img" aria-label="电务智能运维系统">
  <defs>
    <linearGradient id="tg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#eaf6ff"/>
      <stop offset=".78" stop-color="#a8d2f8"/>
      <stop offset="1" stop-color="#6fb0ee"/>
    </linearGradient>
    <filter id="glow2" x="-15%" y="-40%" width="130%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
      <feFlood flood-color="#2b8cff" flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 左右速度斜杠 -->
  <g fill="#e8f4ff" transform="translate(530,135) skewX(-10) translate(-530,-135)">
    <rect x="42" y="62" width="52" height="15" rx="7.5"/>
    <rect x="18" y="96" width="34" height="13" rx="6.5"/>
    <rect x="966" y="62" width="52" height="15" rx="7.5"/>
    <rect x="984" y="96" width="34" height="13" rx="6.5"/>
  </g>

  <!-- 主标题：先深蓝厚度层，再渐变描边发光层 -->
  <g font-family="'Alibaba PuHuiTi 3.0','Alibaba PuHuiTi','PingFang SC','Microsoft YaHei',sans-serif"
     font-weight="900" font-size="132" text-anchor="middle"
     transform="translate(530,140) skewX(-8) translate(-530,-140)">
    <text x="530" y="170" fill="#0a3a80" textLength="860" lengthAdjust="spacingAndGlyphs"
      transform="translate(6,9)">电务智能运维系统</text>
    <text x="530" y="170" fill="url(#tg2)" stroke="#1e6fd0" stroke-width="5"
      paint-order="stroke" stroke-linejoin="round" filter="url(#glow2)"
      textLength="860" lengthAdjust="spacingAndGlyphs">电务智能运维系统</text>
  </g>

  <!-- 底部弧形能量线 -->
  <path d="M150 220 Q 530 250 910 220" fill="none" stroke="#2f8df0" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  <path d="M225 238 Q 530 260 835 238" fill="none" stroke="#7cc0ff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
</svg>
