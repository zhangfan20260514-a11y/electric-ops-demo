<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="4" y1="36" x2="36" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f7ae0"/>
