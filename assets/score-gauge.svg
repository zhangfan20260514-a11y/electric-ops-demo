      <stop offset="100%" stop-color="#66d0ff"/>
    </linearGradient>
    <linearGradient id="arcOn" x1="10" y1="28" x2="30" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
